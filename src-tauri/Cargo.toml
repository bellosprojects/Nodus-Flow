[package]
name = "Nodus_Flow"
version = "0.0.1"
description = "App de diagramacion colaborativa"
authors = ["bello's projects"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nodus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ['devtools'] }
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
mid = "5.0.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-shell = "2.3.6"
axum = "0.8"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
jsonc-parser = { version = "0.29", features = ["cst", "serde"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
dirs = "6"
tauri-plugin-http = "2"
